<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shuaib Store</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: #f5f5f5; }
header { background: #222; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 999; flex-wrap: wrap; gap: 10px; }
.logo { font-size: 22px; font-weight: 700; }
.header-right { display: flex; gap: 10px; align-items: center; }
.cart { font-size: 16px; font-weight: 600; cursor: pointer; background: #00a63e; padding: 8px 15px; border-radius: 20px; }
.account-btn { background: #fff; color: #222; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: 700; border: none; }
.search-box { width: 100%; max-width: 500px; }
.search-box input { width: 100%; padding: 10px 15px; border-radius: 8px; border: none; font-size: 16px; outline: none; }
.container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
.hero { background: linear-gradient(90deg, #00a63e, #008a33); color: #fff; padding: 40px 20px; text-align: center; border-radius: 12px; margin-bottom: 20px; }
.hero h1 { font-size: 28px; margin-bottom: 10px; }
.categories { display: flex; gap: 10px; padding: 15px 0; justify-content: center; flex-wrap: wrap; }
.categories button { padding: 8px 16px; border: 2px solid #00a63e; background: #fff; color: #00a63e; border-radius: 20px; cursor: pointer; font-weight: 700; }
.categories button.active { background: #00a63e; color: #fff; }
.product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; min-height: 200px; }
@media(min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); }
.product-card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; position: relative; }
.product-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
.price { color: #00a63e; font-size: 16px; font-weight: 700; }
.badge { background: #ff4444; color: #fff; padding: 3px 8px; border-radius: 5px; font-size: 12px; position: absolute; top: 10px; left: 10px; font-weight: 700; }
.btn { background: #00a63e; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 8px; }
.popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; }
.popup.show { display: flex; }
.popup-box { background: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; }
.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
.overlay.show { display: block; }
.cart-sidebar { position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100%; background: #fff; z-index: 1001; transition: right 0.4s; display: flex; flex-direction: column; }
.cart-sidebar.show { right: 0; }
.cart-header { padding: 20px; border-bottom: 2px solid #f0f0f0; display: flex; justify-content: space-between; }
.cart-items { flex: 1; overflow-y: auto; padding: 15px; }
.cart-footer { padding: 20px; border-top: 2px solid #f0f0f0; }
footer { background: #222; color: #fff; padding: 30px 20px; margin-top: 40px; text-align: center; }
.whatsapp-float { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: #fff; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 1000; text-decoration: none; }
.no-result { text-align: center; color: #999; grid-column: 1/-1; padding: 40px; font-size: 18px; }
</style>
</head>
<body>

<header>
  <div class="logo">🛍️ Shuaib Store</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Product search karo...">
  </div>
  <div class="header-right">
    <div class="cart" onclick="showOrderForm()">🛒 <span id="cartCount">0</span></div>
    <button class="account-btn" id="accountBtn" onclick="showLogin()">Login</button>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h1>🔥 Mega Sale! Up to 50% OFF</h1>
    <p>Cash on Delivery All Over Pakistan</p>
  </div>
  
  <div class="categories">
    <button onclick="filterCat('all')" class="active" id="btn-all">All</button>
    <button onclick="filterCat('Electronics')" id="btn-Electronics">Electronics</button>
    <button onclick="filterCat('Clothes')" id="btn-Clothes">Clothes</button>
    <button onclick="filterCat('Grocery')" id="btn-Grocery">Grocery</button>
    <button onclick="filterCat('Home')" id="btn-Home">Home</button>
    <button onclick="filterCat('Beauty')" id="btn-Beauty">Beauty</button>
  </div>

  <div class="product-grid" id="productGrid"></div>
</div>

<div class="popup" id="loginPopup">
  <div class="popup-box">
    <span onclick="closePopup()" style="float:right; font-size:24px; cursor:pointer;">&times;</span>
    <h2 id="popupTitle">Login</h2>
    <input type="text" id="userName" placeholder="Full Name" style="display:none; width:100%; padding:12px; margin:8px 0;">
    <input type="email" id="userEmail" placeholder="Email" style="width:100%; padding:12px; margin:8px 0;">
    <input type="password" id="userPassword" placeholder="Password" style="width:100%; padding:12px; margin:8px 0;">
    <button class="btn" id="popupSubmitBtn" onclick="loginUser()">Login</button>
    <div style="text-align:center; margin-top:10px; color:#00a63e; cursor:pointer;" id="switchText" onclick="switchForm()">Don't have account? Sign Up</div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeOrder()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3>Your Cart 🛒</h3>
    <span onclick="closeOrder()" style="font-size:24px; cursor:pointer;">&times;</span>
  </div>
  <div class="cart-items" id="cartItems"><div>Cart khali hai</div></div>
  <div class="cart-footer">
    <div>Total: Rs. <span id="cartTotal">0</span></div>
    <input type="text" id="oName" placeholder="Your Name">
    <input type="tel" id="oPhone" placeholder="Phone Number">
    <textarea id="oAddress" rows="2" placeholder="Full Address"></textarea>
    <button class="btn" onclick="placeOrderCOD()">Place Order - COD</button>
    <button class="btn" style="background:#25D366" onclick="orderOnWhatsApp()">💬 Order on WhatsApp</button>
  </div>
</div>

<a href="https://wa.me/923107389936" target="_blank" class="whatsapp-float">💬</a>

<footer>
  <h3>🛍️ Shuaib Store</h3>
  <p>Contact: 0310-7389936</p>
  <p>© 2026 Shuaib Store</p>
</footer>

<script>
const products = [
{id:1,name:"Smart Watch",price:8999,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",category:"Electronics"},
{id:2,name:"Headphones",price:2499,img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",category:"Electronics"},
{id:3,name:"T-Shirt Men",price:999,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",category:"Clothes"},
{id:4,name:"Running Shoes",price:3499,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",category:"Clothes"},
{id:5,name:"Leather Bag",price:1800,img:"https://images.unsplash.com/photo-1591561954557-607968c989ab?w=400",category:"Clothes"},
{id:6,name:"Bluetooth Speaker",price:2200,img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400",category:"Electronics"},
{id:7,name:"Laptop",price:65000,img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400",category:"Electronics"},
{id:8,name:"Mobile Phone",price:45000,img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",category:"Electronics"},
{id:21,name:"Rice 5kg",price:900,img:"https://images.unsplash.com/photo-1589923188900-85dae523342b?w=400",category:"Grocery"},
{id:30,name:"Table Lamp",price:900,img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400",category:"Home"},
{id:36,name:"Lipstick Set",price:600,img:"https://images.unsplash.com/photo-1586495777744-4413f4c4f4b9?w=400",category:"Beauty"}
];

let cart = []; let currentCategory = 'all'; let isLoginMode = true;
let currentUser = JSON.parse(localStorage.getItem('currentUser'));
const MY_WHATSAPP = "923107389936"; 

window.onload = function(){
  if(currentUser){ document.getElementById('accountBtn').innerText = currentUser.name; }
  showProducts();
}

function showProducts(filterProducts = products) {
  const grid = document.getElementById('productGrid'); 
  grid.innerHTML = '';
  if(filterProducts.length === 0){
    grid.innerHTML = '<div class="no-result">😔 Koi product nahi mila</div>';
    return;
  }
  filterProducts.forEach(p => {
    grid.innerHTML += `<div class="product-card">
      <span class="badge">-23%</span>
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <div class="price">Rs. ${p.price.toLocaleString()}</div>
      <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
    </div>`;
  });
}

function filterCat(cat) {
  currentCategory = cat;
  document.querySelectorAll('.categories button').forEach(btn => btn.classList.remove('active'));
  document.getElementById('btn-' + cat).classList.add('active');
  let filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
  showProducts(filtered);
}

document.getElementById('searchInput').addEventListener('keyup', function(){
  const searchText = this.value.toLowerCase();
  let filtered = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);
  filtered = filtered.filter(p => p.name.toLowerCase().includes(searchText));
  showProducts(filtered);
});

function showLogin(){
  if(currentUser) { if(confirm('Logout karna hai?')){localStorage.removeItem('currentUser'); currentUser=null; document.getElementById('accountBtn').innerText='Login';} return; }
  document.getElementById('loginPopup').classList.add('show');
}

function switchForm(){
  isLoginMode = !isLoginMode;
  document.getElementById('popupTitle').innerText = isLoginMode ? 'Login' : 'Sign Up';
  document.getElementById('userName').style.display = isLoginMode ? 'none' : 'block';
  document.getElementById('popupSubmitBtn').innerText = isLoginMode ? 'Login' : 'Sign Up';
}

function loginUser(){
  const email = document.getElementById('userEmail').value; const password = document.getElementById('userPassword').value; const name = document.getElementById('userName').value;
  let users = JSON.parse(localStorage.getItem('users')) || [];
  if(isLoginMode){ let user = users.find(u => u.email === email && u.password === password); if(user){ currentUser=user; localStorage.setItem('currentUser',JSON.stringify(user)); document.getElementById('accountBtn').innerText=user.name; alert('Login Successful!'); closePopup(); } else { alert('Wrong Email or Password'); }
  else{ if(!name || !email || !password) return alert('Fill all fields'); let newUser={name,email,password}; users.push(newUser); localStorage.setItem('users',JSON.stringify(users)); alert('Account Created!'); switchForm(); }
}

function closePopup(){ document.getElementById('loginPopup').classList.remove('show'); }
function addToCart(id) { const product = products.find(p => p.id === id); cart.push(product); document.getElementById('cartCount').innerText = cart.length; alert(product.name + " added!"); }
function showOrderForm() { document.getElementById('overlay').classList.add('show'); document.getElementById('cartSidebar').classList.add('show'); }
function closeOrder() { document.getElementById('overlay').classList.remove('show'); document.getElementById('cartSidebar').classList.remove('show'); }
function placeOrderCOD() { alert("Order Placed!"); }
function orderOnWhatsApp() { alert("WhatsApp Order"); }
</script>
</body>
</html>
