<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shuaib Store</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: #f5f5f5; }
header { background: #222; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 999; flex-wrap: wrap; gap: 10px; }
.logo { font-size: 22px; font-weight: 700; }
.cart { font-size: 16px; font-weight: 600; cursor: pointer; background: #00a63e; padding: 8px 15px; border-radius: 20px; }
.search-box { width: 100%; max-width: 500px; }
.search-box input { width: 100%; padding: 10px 15px; border-radius: 8px; border: none; font-size: 16px; outline: none; }

.container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
.product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
@media(min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }
@media(min-width: 1024px) { .product-grid { grid-template-columns: repeat(5, 1fr); } }
.product-card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; transition: 0.3s; }
.product-card:hover { transform: translateY(-5px); }
.product-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
.product-card h3 { font-size: 15px; margin-bottom: 8px; height: 40px; overflow: hidden; }
.price { color: #00a63e; font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.btn { background: #00a63e; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; }
.btn:hover { background: #008a33; }
.btn-whatsapp { background: #25D366; }
.btn-whatsapp:hover { background: #1ebe57; }
.btn-danger { background: #ff4444; }
.back { text-align: center; margin: 30px 0; }
.back a { text-decoration: none; color: #333; font-weight: 700; }

/* NAYA SLIDE CART DESIGN */
.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
.overlay.show { display: block; }
.cart-sidebar { 
  position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100%; 
  background: #fff; z-index: 1001; transition: 0.4s; box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  display: flex; flex-direction: column;
}
.cart-sidebar.show { right: 0; }
.cart-header { padding: 20px; border-bottom: 2px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
.cart-header h3 { font-size: 20px; }
.close-btn { font-size: 28px; cursor: pointer; color: #999; }
.cart-items { flex: 1; overflow-y: auto; padding: 15px; }
.cart-item { display: flex; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
.cart-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
.cart-item-info { flex: 1; }
.cart-item-info h4 { font-size: 14px; margin-bottom: 5px; }
.cart-item-info .price { font-size: 14px; }
.remove-btn { background: none; border: none; color: #ff4444; cursor: pointer; font-size: 18px; }
.cart-footer { padding: 20px; border-top: 2px solid #f0f0f0; }
.cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 15px; }
.cart-footer input, .cart-footer textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }

.no-result { text-align: center; color: #999; grid-column: 1/-1; padding: 40px; font-size: 18px; }
.empty-cart { text-align: center; padding: 40px 20px; color: #999; }
</style>
</head>
<body>

<header>
  <div class="logo">🛍️ Shuaib Store</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Product search karo... e.g: watch, shirt, rice">
  </div>
  <div class="cart" onclick="showOrderForm()">🛒 <span id="cartCount">0</span></div>
</header>

<div class="container">
  <div class="product-grid" id="productGrid"></div>
</div>

<div class="back">
  <a href="index.html">⬅️ Back to Portfolio</a>
</div>

<!-- NAYA CART SIDEBAR -->
<div class="overlay" id="overlay" onclick="closeOrder()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3>Your Cart 🛒</h3>
    <span class="close-btn" onclick="closeOrder()">&times;</span>
  </div>
  
  <div class="cart-items" id="cartItems">
    <div class="empty-cart">Cart khali hai<br>Add products</div>
  </div>
  
  <div class="cart-footer">
    <div class="cart-total">Total: <span>Rs. <span id="cartTotal">0</span></span></div>
    <h4>Order Details</h4>
    <input type="text" id="oName" placeholder="Your Name">
    <input type="tel" id="oPhone" placeholder="Phone Number">
    <textarea id="oAddress" rows="2" placeholder="Full Address"></textarea>
    <button class="btn" onclick="placeOrderCOD()">Place Order - COD</button>
    <button class="btn btn-whatsapp" onclick="orderOnWhatsApp()" style="margin-top:10px;">💬 Order on WhatsApp</button>
  </div>
</div>

{id:47,name:"Smart Band",price:1800,img:"https://images.unsplash.com/photo-1575311373937-040b8e1fd5b6?w=400"},
{id:48,name:"Backpack",price:1600,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400"},
{id:49,name:"Water Bottle",price:300,img:"https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400"},
{id:50,name:"Wallet Leather",price:799,img:"https://images.unsplash.com/photo-1627123424574-724758594e93?w=400"}
];

let cart = [];
const MY_WHATSAPP = "923107389936"; 

function showProducts(filterProducts = products) {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  if(filterProducts.length === 0){
    grid.innerHTML = '<div class="no-result">😔 Koi product nahi mila</div>';
    return;
  }
  filterProducts.forEach(p => {
    grid.innerHTML += `<div class="product-card"><img src="${p.img}"><h3>${p.name}</h3><div class="price">Rs. ${p.price.toLocaleString()}</div><button class="btn" onclick="addToCart(${p.id})">Add to Cart</button></div>`;
  });
}

document.getElementById('searchInput').addEventListener('keyup', function(){
  const searchText = this.value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(searchText));
  showProducts(filtered);
});

function addToCart(id) {
  const product = products.find(p => p.id === id);
  cart.push(product);
  updateCart();
  alert(product.name + " added to cart!");
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}

function updateCart() {
  document.getElementById('cartCount').innerText = cart.length;
  let total = 0;
  document.getElementById('cartItems').innerHTML = '';
  
  if(cart.length === 0){
    document.getElementById('cartItems').innerHTML = '<div class="empty-cart">Cart khali hai<br>Add products</div>';
  } else {
    cart.forEach((item, index) => {
      total += item.price;
      document.getElementById('cartItems').innerHTML += `
        <div class="cart-item">
          <img src="${item.img}">
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <div class="price">Rs. ${item.price.toLocaleString()}</div>
          </div>
          <button class="remove-btn" onclick="removeFromCart(${index})">×</button>
        </div>
      `;
    });
  }
  document.getElementById('cartTotal').innerText = total.toLocaleString();
}

function showOrderForm() {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('cartSidebar').classList.add('show');
}

function closeOrder() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('cartSidebar').classList.remove('show');
}

function placeOrderCOD() {
  if(cart.length === 0) return alert("Cart khali hai!");
  alert("Order Placed! COD - Hum jald contact karenge");
  cart = [];
  updateCart();
  closeOrder();
}

function orderOnWhatsApp() {
  if(cart.length === 0) return alert("Pehle cart me product add karo!");
  const name = document.getElementById('oName').value;
  const phone = document.getElementById('oPhone').value;
  const address = document.getElementById('oAddress').value;
  if(!name || !phone || !address) return alert("Name, Phone aur Address bharo!");

  let message = `*NEW ORDER - Shuaib Store*%0A%0A`;
  message += `*Customer:* ${name}%0A*Phone:* ${phone}%0A*Address:* ${address}%0A%0A*Products:*%0A`;
  let total = 0;
  cart.forEach((item, i) => {
    total += item.price;
    message += `${i+1}. ${item.name} - Rs.${item.price}%0A`;
  });
  message += `%0A*Total: Rs.${total.toLocaleString()}*%0A%0A*Payment: Cash on Delivery*`;
  window.open(`https://wa.me/${MY_WHATSAPP}?text=${message}`, '_blank');
}

showProducts();
</script>

</html>
