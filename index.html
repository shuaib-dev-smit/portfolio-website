<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHUAIB - Web Developer Portfolio</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a; 
      color: #fff; 
      line-height: 1.7; 
      scroll-behavior: smooth; 
    }
    
    :root {
      --green: #00ff88;
      --blue: #0077ff;
      --glass: rgba(255, 255, 255, 0.05);
    }
    
    header { 
      background: rgba(10, 10, 10, 0.9); 
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--green);
      padding: 18px 0; 
      position: fixed; 
      width: 100%; 
      top: 0; 
      z-index: 1000; 
    }
    nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .logo { 
      font-size: 26px; 
      font-weight: bold;
      background: linear-gradient(90deg, var(--green), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px; 
    }
    
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .desktop-menu { display: flex; gap: 15px; }
    .desktop-menu a { 
      color: #fff; 
      text-decoration: none; 
      font-weight: 600; 
      padding: 10px 18px; 
      border-radius: 8px; 
      transition: 0.3s; 
      background: var(--glass);
      border: 1px solid rgba(0,255,136,0.1);
    }
    .desktop-menu a:hover { 
      background: linear-gradient(90deg, var(--green), var(--blue)); 
      color: #000; 
      transform: translateY(-2px);
    }
    .btn-login {
      background: linear-gradient(90deg, var(--green), var(--blue));
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    
    section { padding: 100px 20px; max-width: 1200px; margin: 0 auto; }
    #home { text-align: center; padding-top: 180px; min-height: 100vh; }
    
    #home h1 { 
      font-size: 56px; 
      font-weight: 800;
      background: linear-gradient(90deg, var(--green), var(--blue)); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      margin-bottom: 20px; 
    }
    #home p { font-size: 22px; color: #aaa; margin-bottom: 40px; }
    
    #home img { 
      width: 220px; 
      height: 220px; 
      border-radius: 50%; 
      border: 4px solid var(--green);
      object-fit: cover; 
      box-shadow: 0 0 40px rgba(0,255,136,0.5); 
      margin: 30px 0;
    }
    
    .btn { 
      display: inline-block; 
      padding: 14px 35px; 
      background: linear-gradient(90deg, var(--green), var(--blue)); 
      color: #000; 
      text-decoration: none; 
      border-radius: 50px;
      font-weight: 700;
